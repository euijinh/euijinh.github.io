{%- assign ak_figure_a_src = site.baseurl | append: "/assets/ak-momentum/figure-a/ak-momentum-field.html" -%}
<div class="d-figure__frame d-figure__frame--flush">
  <iframe id="ak-memory-field-figure" class="d-figure__embed" src="{{ ak_figure_a_src }}" title="Animation: EMA momentum and AK-Momentum memory fields in fixed input coordinates" loading="lazy" scrolling="no" style="--embed-height: 1228px; --embed-height-wide: 717px;"></iframe>
</div>
<script>
(() => {
  const frame = document.getElementById('ak-memory-field-figure');
  if (!frame) return;
  window.addEventListener('message', event => {
    if (event.source !== frame.contentWindow) return;
    const data = event.data;
    if (data && data.type === 'ak-memory-resize' && Number.isFinite(data.height) && data.height > 100 && data.height < 1500) {
      frame.style.height = Math.ceil(data.height) + 'px';
    }
  });
})();
</script>
