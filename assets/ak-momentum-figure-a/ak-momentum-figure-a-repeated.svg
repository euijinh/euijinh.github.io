<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="figure-a-title figure-a-desc"><title id="figure-a-title">Repeated inputs shorten memory.</title><desc id="figure-a-desc">For repeated unit key u, the contribution of initial memory decays by .5 per query in that direction and .9 in the perpendicular direction. EMA decays both by .9. New writes are excluded.</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1200" height="840" fill="#ffffff" /><text x="48" y="83" font-size="36" fill="#172b42" font-weight="600" text-anchor="start" >Repeated inputs shorten memory.</text><text x="48" y="119" font-size="21" fill="#566577" font-weight="400" text-anchor="start" >Unit key x̂ = u    ·    β = 0.90    ·    η = 0.40    ·    Initial memory only; new writes excluded</text><line x1="48" y1="148" x2="1152" y2="148" stroke="#dbe1e8" stroke-width="1" /><text x="48" y="193" font-size="16" fill="#566577" font-weight="600" text-anchor="start" >n = 6</text><text x="142" y="193" font-size="26" fill="#172b42" font-weight="500" text-anchor="start" >After 6 queries along u</text><line x1="288" y1="594" x2="288" y2="257.03999999999996" stroke="#eef1f5" stroke-width="1" /><line x1="132" y1="438" x2="468.96000000000004" y2="438" stroke="#eef1f5" stroke-width="1" /><text x="288" y="622" font-size="18" fill="#566577" font-weight="400" text-anchor="middle" >0.5</text><text x="116" y="444" font-size="18" fill="#566577" font-weight="400" text-anchor="end" >0.5</text><line x1="444" y1="594" x2="444" y2="257.03999999999996" stroke="#eef1f5" stroke-width="1" /><line x1="132" y1="282" x2="468.96000000000004" y2="282" stroke="#eef1f5" stroke-width="1" /><text x="444" y="622" font-size="18" fill="#566577" font-weight="400" text-anchor="middle" >1.0</text><text x="116" y="288" font-size="18" fill="#566577" font-weight="400" text-anchor="end" >1.0</text><text x="119" y="621" font-size="18" fill="#566577" font-weight="400" text-anchor="end" >0</text><line x1="132" y1="594" x2="497.59999999999997" y2="594" stroke="#172b42" stroke-width="2" stroke-linecap="round" /><path d="M506.4,594 L495.4,600.16 L495.4,587.84 Z" fill="#172b42"/><line x1="132" y1="594" x2="132" y2="228.40000000000003" stroke="#a5aebc" stroke-width="2" stroke-linecap="round" /><path d="M132,219.60000000000002 L138.16,230.60000000000002 L125.84,230.60000000000002 Z" fill="#a5aebc"/><text x="525.12" y="601" font-size="27" fill="#172b42" font-weight="500" text-anchor="start" >u</text><text x="110" y="239.60000000000002" font-size="27" fill="#172b42" font-weight="500" text-anchor="middle" >v</text><line x1="132" y1="594" x2="444" y2="282" stroke="#a5aebc" stroke-width="2" stroke-dasharray="6 6"/><circle cx="444" cy="282" r="5" fill="#ffffff" stroke="#a5aebc" stroke-width="2"/><text x="457" y="260" font-size="18" fill="#566577" font-weight="400" text-anchor="start" >n = 0</text><line x1="132" y1="594" x2="297.809592" y2="428.190408" stroke="#a5aebc" stroke-width="3" stroke-dasharray="7 5"/><circle cx="297.809592" cy="428.190408" r="6" fill="#a5aebc" /><polyline points="444,282 288,313.2 210,341.28 171,366.55199999999996 151.5,389.29679999999996 141.75,409.76712 136.875,428.190408 136.875,428.190408" fill="none" stroke="#4b60bd" stroke-width="2" opacity=".45"/><circle cx="444" cy="282" r="3" fill="#4b60bd" /><circle cx="288" cy="313.2" r="3" fill="#4b60bd" /><circle cx="210" cy="341.28" r="3" fill="#4b60bd" /><circle cx="171" cy="366.55199999999996" r="3" fill="#4b60bd" /><circle cx="151.5" cy="389.29679999999996" r="3" fill="#4b60bd" /><circle cx="141.75" cy="409.76712" r="3" fill="#4b60bd" /><circle cx="136.875" cy="428.190408" r="3" fill="#4b60bd" /><line x1="136.875" y1="428.190408" x2="297.809592" y2="428.190408" stroke="#dbe1e8" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="132" y1="594" x2="136.61638124660215" y2="436.9866069711688" stroke="#4b60bd" stroke-width="5" stroke-linecap="round" /><path d="M13