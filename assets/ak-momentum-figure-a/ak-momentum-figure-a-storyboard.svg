<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="story-title story-desc"><title id="story-title">AK-Momentum, one update in four stages</title><desc id="story-desc">Starting from one in each direction, global decay leaves .9 in both. Removing .4 from the queried u direction leaves .5 and .9. Writing .2 along u gives .7 and .9. Blue shows old memory and green the new write.</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1200" height="1000" fill="#ffffff" /><text x="48" y="83" font-size="36" fill="#172b42" font-weight="600" text-anchor="start" >One update, four visible operations.</text><text x="48" y="119" font-size="21" fill="#566577" font-weight="400" text-anchor="start" >Unit key x̂ = u    ·    β = 0.90    ·    η = 0.40    ·    δ = 0.50    ·    Illustrative example</text><line x1="48" y1="148" x2="1152" y2="148" stroke="#dbe1e8" stroke-width="1" /><text x="422" y="202" font-size="24" fill="#172b42" font-weight="600" text-anchor="start" >u  ·  queried direction</text><text x="833" y="202" font-size="24" fill="#172b42" font-weight="600" text-anchor="start" >v  ·  perpendicular</text><text x="48" y="278" font-size="20" fill="#566577" font-weight="600" text-anchor="start" >01</text><text x="97" y="278" font-size="28" fill="#172b42" font-weight="600" text-anchor="start" >Read</text><text x="97" y="317" font-size="20" fill="#566577" font-weight="400" text-anchor="start" >Use the original prediction.</text><rect x="422" y="254" width="265" height="52" fill="#f5f7fb" /><rect x="422" y="254" width="265" height="52" fill="#4b60bd" /><rect x="687" y="254" width="0" height="52" fill="#087f75" /><text x="700" y="290" font-size="26" fill="#172b42" font-weight="600" text-anchor="start" >1.00</text><rect x="833" y="254" width="265" height="52" fill="#f5f7fb" /><rect x="833" y="254" width="265" height="52" fill="#4b60bd" /><rect x="1098" y="254" width="0" height="52" fill="#087f75" /><text x="1111" y="290" font-size="26" fill="#172b42" font-weight="600" text-anchor="start" >1.00</text><line x1="48" y1="372" x2="1152" y2="372" stroke="#dbe1e8" stroke-width="1" /><text x="48" y="435" font-size="20" fill="#566577" font-weight="600" text-anchor="start" >02</text><text x="97" y="435" font-size="28" fill="#172b42" font-weight="600" text-anchor="start" >Decay</text><text x="97" y="474" font-size="20" fill="#566577" font-weight="400" text-anchor="start" >Multiply both old values by β.</text><rect x="422" y="411" width="265" height="52" fill="#f5f7fb" /><rect x="422" y="411" width="238.5" height="52" fill="#4b60bd" /><rect x="660.5" y="411" width="0" height="52" fill="#087f75" /><text x="700" y="447" font-size="26" fill="#172b42" font-weight="600" text-anchor="start" >0.90</text><rect x="833" y="411" width="265" height="52" fill="#f5f7fb" /><rect x="833" y="411" width="238.5" height="52" fill="#4b60bd" /><rect x="1071.5" y="411" width="0" height="52" fill="#087f75" /><text x="1111" y="447" font-size="26" fill="#172b42" font-weight="600" text-anchor="start" >0.90</text><line x1="48" y1="529" x2="1152" y2="529" stroke="#dbe1e8" stroke-width="1" /><text x="48" y="592" font-size="20" fill="#566577" font-weight="600" text-anchor="start" >03</text><text x="97" y="592" font-size="28" fill="#172b42" font-weight="600" text-anchor="start" >Remove</text><text x="97" y="631" font-size="20" fill="#566577" font-weight="400" text-anchor="start" >Subtract η × 1.00 along u.</text><rect x="422" y="568" width="265" height="52" fill="#f5f7fb" /><rect x="422" y="568" width="132.5" height="52" fill="#4b60bd" /><rect x="554.5" y="568" width="0" height="52" fill="#087f75" /><text x="700" y="604" font-size="26" fill="#172b42" font-weight="600" text-anchor="start" >0.50</text><rect x="833" y="568" width="265" height="52" fill="#f5f7fb" /><rect x="833" y="568" width="238.5" height="52" fill="#4b60bd" /><rect x="1071.5" y="568" width="0" height="52" fill="#087f75" /><text x="1111" y="604" font-size="26" fill="#172b42" font-weight="600" text-anchor="start" >0.90</text><line x1="48" y1="686" x2="1152" y2="686" stroke="#dbe1e8" stroke-width="1" /><text x="48" y="749" font-size="20" fill="#566577" font-weight="600" text-anchor="start" >04</text><text x="97" y="749" font-size="28" fill="#172b42" font-weight="600" text-anchor="start" >Write</text><text x="97" y="788" font-size="20" fill="#566577" font-weight="400" text-anchor="start" >Add ηδ = 0.20 along u.</text><rect x="422" y="725" width="265" height="52" fill="#f5f7fb" /><rect x="422" y="725" width="132.5" height="52" fill="#4b60bd" /><rect x="554.5" y="725" width="53" height="52" fill="#087f75" /><text x="700" y="761" font-size="26" fill="#172b42" font-weight="600" text-anchor="start" >0.70</text><text x="422" y="815" font-size="21" fill="#566577" font-weight="400" text-anchor="start" >0.50 old + 0.20 new</text><rect x="833" y="725" width="265" height="52" fill="#f5f7fb" /><rect x="833" y="725" width="238.5" height="52" fill="#4b60bd" /><rect x="1071.5" y="725" width="0" height="52" fill="#087f75" /><text x="1111" y="761" font-size="26" fill="#172b42" font-weight="600" text-anchor="start" >0.90</text><rect x="48" y="884" width="18" height="18" fill="#4b60bd" /><text x="79" y="901" font-size="21" fill="#172b42" font-weight="400" text-anchor="start" >Retained old memory</text><rect x="422" y="884" width="18" height="18" fill="#087f75" /><text x="454" y="901" font-size="21" fill="#172b42" font-weight="400" text-anchor="start" >Newly written value</text><text x="48" y="962" font-size="25" fill="#172b42" font-weight="500" text-anchor="start" >Along u:  Mₜu = (β − η)Mₜ₋₁u + ηδ</text><text x="713" y="962" font-size="25" fill="#172b42" font-weight="500" text-anchor="start" >Along v:  Mₜv = βMₜ₋₁v</text></g></svg>