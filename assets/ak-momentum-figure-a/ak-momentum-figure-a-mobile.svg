<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1090" viewBox="0 0 640 1090" role="img" aria-labelledby="figure-a-title figure-a-desc"><title id="figure-a-title">Refresh the direction you see.</title><desc id="figure-a-desc">One row of the momentum buffer begins at (1,1). With key u, global decay multiplies both components by .9. Selective removal subtracts .4 of the original queried component; the new write adds .4 times .5. The queried component becomes .7 and the perpendicular component becomes .9. Blue is old memory, green is new content, orange is extra removal.</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="640" height="1090" fill="#ffffff" /><text x="36" y="83" font-size="30" fill="#172b42" font-weight="600" text-anchor="start" >Refresh the direction you see.</text><text x="36" y="119" font-size="19" fill="#566577" font-weight="400" text-anchor="start" >Unit key x̂ = u  ·  β = 0.90  ·  η = 0.40</text><text x="36" y="146" font-size="18" fill="#566577" font-weight="400" text-anchor="start" >δ = 0.50  ·  Illustrative single-output example</text><line x1="36" y1="164" x2="604" y2="164" stroke="#dbe1e8" stroke-width="1" /><text x="36" y="204" font-size="15" fill="#566577" font-weight="600" text-anchor="start" >05</text><text x="36" y="237" font-size="23" fill="#172b42" font-weight="500" text-anchor="start" >A direction-selective refresh</text><line x1="217" y1="512" x2="217" y2="285.2" stroke="#eef1f5" stroke-width="1" /><line x1="112" y1="407" x2="338.8" y2="407" stroke="#eef1f5" stroke-width="1" /><text x="217" y="540" font-size="18" fill="#566577" font-weight="400" text-anchor="middle" >0.5</text><text x="96" y="413" font-size="18" fill="#566577" font-weight="400" text-anchor="end" >0.5</text><line x1="322" y1="512" x2="322" y2="285.2" stroke="#eef1f5" stroke-width="1" /><line x1="112" y1="302" x2="338.8" y2="302" stroke="#eef1f5" stroke-width="1" /><text x="322" y="540" font-size="18" fill="#566577" font-weight="400" text-anchor="middle" >1.0</text><text x="96" y="308" font-size="18" fill="#566577" font-weight="400" text-anchor="end" >1.0</text><text x="99" y="539" font-size="18" fill="#566577" font-weight="400" text-anchor="end" >0</text><line x1="112" y1="512" x2="355.2" y2="512" stroke="#172b42" stroke-width="2" stroke-linecap="round" /><path d="M364,512 L353,518.16 L353,505.84 Z" fill="#172b42"/><line x1="112" y1="512" x2="112" y2="268.8" stroke="#a5aebc" stroke-width="2" stroke-linecap="round" /><path d="M112,260 L118.16,271 L105.84,271 Z" fill="#a5aebc"/><text x="376.6" y="519" font-size="27" fill="#172b42" font-weight="500" text-anchor="start" >u</text><text x="90" y="280" font-size="27" fill="#172b42" font-weight="500" text-anchor="middle" >v</text><line x1="112" y1="512" x2="322" y2="302" stroke="#a5aebc" stroke-width="2" stroke-dasharray="6 6"/><circle cx="322" cy="302" r="5" fill="#ffffff" stroke="#a5aebc" stroke-width="2"/><text x="335" y="290" font-size="18" fill="#566577" font-weight="400" text-anchor="start" >before</text><line x1="259" y1="323" x2="259" y2="512" stroke="#dbe1e8" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="112" y1="323" x2="259" y2="323" stroke="#dbe1e8" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="301" y1="295" x2="225.8" y2="295" stroke="#b56524" stroke-width="3" stroke-linecap="round" /><path d="M217,295 L228,288.84 L228,301.16 Z" fill="#b56524"/><text x="259" y="281" font-size="19" fill="#b56524" font-weight="600" text-anchor="middle" >−0.40</text><line x1="112" y1="512" x2="212.72634220562804" y2="330.6925840298695" stroke="#4b60bd" stroke-width="5" stroke-linecap="round" /><path d="M217,323 L217.0427365779437,335.6072904933973 L206.2731189361264,329.62416958127653 Z" fill="#4b60bd"/><circle cx="217" cy="323" r="5" fill="#4b60bd" /><line x1="217" y1="323" x2="250.2" y2="323" stroke="#087f75" stroke-width="7" stroke-linecap="round" /><path d="M259,323 L248,329.16 L248,316.84 Z" fill="#087f75"/><circle cx="259" cy="323" r="6" fill="#087f75" /><text x="238" y="354" font-size="19" fill="#087f75" font-weight="600" text-anchor="middle" >+0.20</text><text x="274" y="331" font-size="19" fill="#172b42" font-weight="500" text-anchor="start" >after</text><text x="320" y="572" font-size="18" fill="#566577" font-weight="400" text-anchor="middle" >One row of the momentum buffer</text><text x="54" y="623" font-size="23" fill="#172b42" font-weight="500" text-anchor="start" >Stored error prediction</text><text x="54" y="669" font-size="22" fill="#172b42" font-weight="600" text-anchor="start" >u  ·  queried</text><rect x="54" y="686" width="414" height="44" fill="#f5f7fb" /><rect x="54" y="686" width="207" height="44" fill="#4b60bd" /><rect x="261" y="686" width="82.80000000000001" height="44" fill="#087f75" /><text x="157.5" y="715" font-size="20" fill="#ffffff" font-weight="500" text-anchor="middle" >0.50</text><text x="302.4" y="715" font-size="19" fill="#ffffff" font-weight="500" text-anchor="middle" >0.20</text><text x="488" y="716" font-size="25" fill="#172b42" font-weight="600" text-anchor="start" >0.70</text><text x="54" y="775" font-size="22" fill="#172b42" font-weight="600" text-anchor="start" >v  ·  perpendicular</text><rect x="54" y="792" width="414" height="44" fill="#f5f7fb" /><rect x="54" y="792" width="372.6" height="44" fill="#4b60bd" /><text x="240.3" y="821" font-size="20" fill="#ffffff" font-weight="500" text-anchor="middle" >0.90</text><text x="488" y="822" font-size="25" fill="#172b42" font-weight="600" text-anchor="start" >0.90</text><text x="54" y="884" font-size="19" fill="#566577" font-weight="400" text-anchor="start" >u retains β − η = 0.50 of its old value.</text><text x="54" y="915" font-size="19" fill="#566577" font-weight="400" text-anchor="start" >v retains β = 0.90; it still decays.</text><rect x="54" y="937" width="18" height="18" fill="#4b60bd" /><text x="83" y="952" font-size="18" fill="#172b42" font-weight="400" text-anchor="start" >Old memory</text><rect x="239" y="937" width="18" height="18" fill="#087f75" /><text x="268" y="952" font-size="18" fill="#172b42" font-weight="400" text-anchor="start" >New write</text><line x1="409" y1="945" x2="438" y2="945" stroke="#b56524" stroke-width="3" /><text x="449" y="952" font-size="18" fill="#172b42" font-weight="400" text-anchor="start" >Removal</text><rect x="32" y="972" width="576" height="85" fill="#f5f7fb" rx="10"/><text x="50" y="1004" font-size="26" fill="#172b42" font-weight="500" text-anchor="start" >Mₜ = βMₜ₋₁ − η(Mₜ₋₁x̂)x̂ᵀ</text><text x="116" y="1039" font-size="26" fill="#087f75" font-weight="600" text-anchor="start" >+ ηδx̂ᵀ</text><text x="36" y="1077" font-size="17" fill="#566577" font-weight="400" text-anchor="start" >Two input dimensions · one output component</text></g></svg>