<!-- Copy this block into the Figure A location in the project post.
     Copy the supplied figure assets into /assets/ak-momentum/figure-a/. -->
<figure id="ak-momentum-figure-a" data-asset-base="/assets/ak-momentum/figure-a/" style="margin:1.5em 0">
  <div class="ak-a-surface" style="position:relative">
    <picture class="ak-a-fallback">
      <source media="(max-width:680px)" srcset="/assets/ak-momentum/figure-a/ak-momentum-figure-a-mobile.svg" type="image/svg+xml">
      <source srcset="/assets/ak-momentum/figure-a/ak-momentum-figure-a.svg" type="image/svg+xml">
      <img src="/assets/ak-momentum/figure-a/ak-momentum-figure-a.png"
        width="1200" height="840" style="display:block;width:100%;height:auto"
        alt="AK-Momentum starts from memory (1,1). Global decay gives (0.9,0.9); extra removal along input key u gives (0.5,0.9); writing 0.2 along u gives (0.7,0.9). The perpendicular v component still decays by beta.">
    </picture>
  </div>
  <button class="ak-a-open" type="button" hidden style="margin:12px 0;padding:10px 14px;font:inherit;cursor:pointer">Open interactive figure</button>
  <figcaption style="margin-top:0.8em">
    <strong>Figure A. Refreshing a stored association.</strong>
    An input along <em>u</em> triggers extra forgetting and a new write along that direction.
    Blue denotes retained old memory; green denotes newly written content.
    The perpendicular direction <em>v</em> still undergoes ordinary decay.
    The repeated-key view isolates initial-memory retention and excludes new writes.
    <a href="/assets/ak-momentum/figure-a/ak-momentum-figure-a.html" target="_blank" rel="noopener">Open separately</a>
    · <a href="/assets/ak-momentum/figure-a/ak-momentum-figure-a.mp4">Video</a>
    · <a href="/assets/ak-momentum/figure-a/ak-momentum-figure-a.png">Static figure</a>
  </figcaption>
</figure>
<script>
(() => {
  const root=document.getElementById('ak-momentum-figure-a');
  if(!root)return;
  const surface=root.querySelector('.ak-a-surface');
  const fallback=root.querySelector('.ak-a-fallback');
  const open=root.querySelector('.ak-a-open');
  const source=new URL(root.dataset.assetBase+'ak-momentum-figure-a.html',location.href);
  let iframe=null,ready=false;
  function load(){
    if(iframe)return;
    iframe=document.createElement('iframe');
    iframe.title='AK-Momentum: an interactive direction-selective memory update';
    iframe.src=source.href;
    iframe.setAttribute('scrolling','no');
    iframe.setAttribute('aria-hidden','true');
    iframe.tabIndex=-1;
    iframe.style.cssText='position:absolute;inset:0;width:100%;height:1050px;border:0;opacity:0;pointer-events:none;background:white';
    surface.appendChild(iframe);
  }
  window.addEventListener('message',event=>{
    if(!iframe||event.source!==iframe.contentWindow||event.origin!==source.origin)return;
    const message=event.data;
    if(!message||message.type!=='ak-figure-a-resize'||!Number.isFinite(message.height))return;
    if(message.height<100||message.height>5000)return;
    iframe.style.height=Math.ceil(message.height)+'px';
    if(!ready){
      ready=true;fallback.hidden=true;open.hidden=true;
      iframe.style.position='static';iframe.style.opacity='1';iframe.style.pointerEvents='auto';
      iframe.style.display='block';iframe.removeAttribute('aria-hidden');iframe.removeAttribute('tabindex');
    }
  });
  open.hidden=false;open.addEventListener('click',load);
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)load();
})();
</script>
