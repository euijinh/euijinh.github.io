<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="figure-a-title figure-a-desc"><title id="figure-a-title">Refresh the direction you see.</title><desc id="figure-a-desc">One row of the momentum buffer begins at (1,1). With key u, global decay multiplies both components by .9. Selective removal subtracts .4 of the original queried component; the new write adds .4 times .5. The queried component becomes .7 and the perpendicular component becomes .9. Blue is old memory, green is new content, orange is extra removal.</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1200" height="840" fill="#ffffff" /><text x="48" y="83" font-size="36" fill="#172b42" font-weight="600" text-anchor="start" >Refresh the direction you see.</text><text x="48" y="119" font-size="21" fill="#566577" font-weight="400" text-anchor="start" >Unit key x̂ = u    ·    β = 0.90    ·    η = 0.40    ·    δ = 0.50    ·    Illustrative example</text><line x1="48" y1="148" x2="1152" y2="148" stroke="#dbe1e8" stroke-width="1" /><text x="48" y="193" font-size="16" fill="#566577" font-weight="600" text-anchor="start" >05</text><text x="96" y="193" font-size="26" fill="#172b42" font-weight="500" text-anchor="start" >A direction-selective refresh</text><line x1="288" y1="594" x2="288" y2="257.03999999999996" stroke="#eef1f5" stroke-width="1" /><line x1="132" y1="438" x2="468.96000000000004" y2="438" stroke="#eef1f5" stroke-width="1" /><text x="288" y="622" font-size="18" fill="#566577" font-weight="400" text-anchor="middle" >0.5</text><text x="116" y="444" font-size="18" fill="#566577" font-weight="400" text-anchor="end" >0.5</text><line x1="444" y1="594" x2="444" y2="257.03999999999996" stroke="#eef1f5" stroke-width="1" /><line x1="132" y1="282" x2="468.96000000000004" y2="282" stroke="#eef1f5" stroke-width="1" /><text x="444" y="622" font-size="18" fill="#566577" font-weight="400" text-anchor="middle" >1.0</text><text x="116" y="288" font-size="18" fill="#566577" font-weight="400" text-anchor="end" >1.0</text><text x="119" y="621" font-size="18" fill="#566577" font-weight="400" text-anchor="end" >0</text><line x1="132" y1="594" x2="497.59999999999997" y2="594" stroke="#172b42" stroke-width="2" stroke-linecap="round" /><path d="M506.4,594 L495.4,600.16 L495.4,587.84 Z" fill="#172b42"/><line x1="132" y1="594" x2="132" y2="228.40000000000003" stroke="#a5aebc" stroke-width="2" stroke-linecap="round" /><path d="M132,219.60000000000002 L138.16,230.60000000000002 L125.84,230.60000000000002 Z" fill="#a5aebc"/><text x="525.12" y="601" font-size="27" fill="#172b42" font-weight="500" text-anchor="start" >u</text><text x="110" y="239.60000000000002" font-size="27" fill="#172b42" font-weight="500" text-anchor="middle" >v</text><line x1="132" y1="594" x2="444" y2="282" stroke="#a5aebc" stroke-width="2" stroke-dasharray="6 6"/><circle cx="444" cy="282" r="5" fill="#ffffff" stroke="#a5aebc" stroke-width="2"/><text x="457" y="270" font-size="18" fill="#566577" font-weight="400" text-anchor="start" >before</text><line x1="350.4" y1="313.2" x2="350.4" y2="594" stroke="#dbe1e8" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="132" y1="313.2" x2="350.4" y2="313.2" stroke="#dbe1e8" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="412.8" y1="285.2" x2="296.8" y2="285.2" stroke="#b56524" stroke-width="3" stroke-linecap="round" /><path d="M288,285.2 L299,279.03999999999996 L299,291.36 Z" fill="#b56524"/><text x="350.4" y="271.2" font-size="19" fill="#b56524" font-weight="600" text-anchor="middle" >−0.40</text><line x1="132" y1="594" x2="283.72634220562804" y2="320.8925840298695" stroke="#4b60bd" stroke-width="5" stroke-linecap="round" /><path d="M288,313.2 L288.04273657794374,325.80729049339726 L277.27311893612637,319.8241695812765 Z" fill="#4b60bd"/><circle cx="288" cy="313.2" r="5" fill="#4b60bd" /><line x1="288" y1="313.2" x2="341.59999999999997" y2="313.2" stroke="#087f75" stroke-width="7" stroke-linecap="round" /><path d="M350.4,313.2 L339.4,319.36 L339.4,307.03999999999996 Z" fill="#087f75"/><circle cx="350.4" cy="313.2" r="6" fill="#087f75" /><text x="319.2" y="344.2" font-size="19" fill="#087f75" font-weight="600" text-anchor="middle" >+0.20</text><text x="365.4" y="321.2" font-size="19" fill="#172b42" font-weight="500" text-anchor="start" >after</text><text x="343" y="648" font-size="20" fill="#566577" font-weight="400" text-anchor="middle" >One row of the momentum buffer</text><text x="672" y="258" font-size="24" fill="#172b42" font-weight="500" text-anchor="start" >Stored error prediction</text><text x="672" y="304" font-size="22" fill="#172b42" font-weight="600" text-anchor="start" >u  ·  queried</text><rect x="672" y="321" width="348" height="48" fill="#f5f7fb" /><rect x="672" y="321" width="174" height="48" fill="#4b60bd" /><rect x="846" y="321" width="69.60000000000001" height="48" fill="#087f75" /><text x="759" y="352" font-size="20" fill="#ffffff" font-weight="500" text-anchor="middle" >0.50</text><text x="880.8" y="352" font-size="19" fill="#ffffff" font-weight="500" text-anchor="middle" >0.20</text><text x="1040" y="353" font-size="25" fill="#172b42" font-weight="600" text-anchor="start" >0.70</text><text x="672" y="437" font-size="22" fill="#172b42" font-weight="600" text-anchor="start" >v  ·  perpendicular</text><rect x="672" y="454" width="348" height="48" fill="#f5f7fb" /><rect x="672" y="454" width="313.2" height="48" fill="#4b60bd" /><text x="828.6" y="485" font-size="20" fill="#ffffff" font-weight="500" text-anchor="middle" >0.90</text><text x="1040" y="486" font-size="25" fill="#172b42" font-weight="600" text-anchor="start" >0.90</text><text x="672" y="566" font-size="21" fill="#566577" font-weight="400" text-anchor="start" >u retains β − η = 0.50 of its old value.</text><text x="672" y="597" font-size="21" fill="#566577" font-weight="400" text-anchor="start" >v retains β = 0.90; it still decays.</text><rect x="54" y="674" width="18" height="18" fill="#4b60bd" /><text x="85" y="689" font-size="21" fill="#172b42" font-weight="400" text-anchor="start" >Old memory</text><rect x="405" y="674" width="18" height="18" fill="#087f75" /><text x="436" y="689" font-size="21" fill="#172b42" font-weight="400" text-anchor="start" >New write</text><line x1="758" y1="682" x2="791" y2="682" stroke="#b56524" stroke-width="3" /><text x="806" y="689" font-size="21" fill="#172b42" font-weight="400" text-anchor="start" >Removal</text><rect x="38" y="731" width="1124" height="82" fill="#f5f7fb" rx="10"/><text x="65" y="773" font-size="29" fill="#172b42" font-weight="500" text-anchor="start" >Mₜ =</text><text x="162" y="773" font-size="29" fill="#4b60bd" font-weight="500" text-anchor="start" >βMₜ₋₁</text><text x="283" y="773" font-size="29" fill="#b56524" font-weight="500" text-anchor="start" >− η(Mₜ₋₁x̂)x̂ᵀ</text><text x="584" y="773" font-size="29" fill="#087f75" font-weight="500" text-anchor="start" >+ ηδx̂ᵀ</text><text x="850" y="773" font-size="24" fill="#566577" font-weight="400" text-anchor="start" >x̂ = u  ·  u ⟂ v</text></g></svg>